
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Bộ trống điện tử</title>

  <link rel="stylesheet" href="style.css">
  <script src="audio.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>

  <header>
    <h1>Bộ trống điện tử</h1>
    <p>Nhấn A, S, D, F để chơi trống.</p>
  </header>

  <main>
    <section aria-label="Các nút trống">

      <button class="nut-trong"
              data-key="a"
              data-sound="sounds/I Ain't Worried.mp3">
        A - Trống cái
      </button>

      <button class="nut-trong"
              data-key="s"
              data-sound="sounds/New Divide.mp3">
        S - Trống lẫy
      </button>

      <button class="nut-trong"
              data-key="d"
              data-sound="sounds/Waiting For Love.mp3">
        D - Chũm chọe
      </button>

      <button class="nut-trong"
              data-key="f"
              data-sound="sounds/Without You.mp3">
        F - Vỗ tay
      </button>

    </section>

    <section aria-label="Bộ ghi nhịp">
      <h2>Ghi lại nhịp trống</h2>

      <button id="bat-dau">Bắt đầu ghi</button>
      <button id="dung">Dừng</button>
      <button id="phat-lai">Phát lại</button>

      <p id="trang-thai" role="status">
        Sẵn sàng
      </p>
    </section>
  </main>

</body>
</html>
