
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Ngày hội công nghệ 2026</title>

  <link rel="stylesheet" href="style.css">

  <script src="countdown.js" defer></script>
  <script src="validation.js" defer></script>
  <script src="form.js" defer></script>
</head>
<body>

  <header>
    <h1>Ngày hội công nghệ 2026</h1>
    <p>
      Chào mừng đến với sự kiện
      dành cho sinh viên công nghệ thông tin.
    </p>
  </header>

  <main>

    <section aria-labelledby="tieu-de-dem-nguoc">
      <h2 id="tieu-de-dem-nguoc">
        Thời gian còn lại
      </h2>

      <p id="dong-ho"
         role="timer"
         aria-live="off">
        Đang tải đồng hồ...
      </p>
    </section>

    <section aria-labelledby="tieu-de-dang-ky">
      <h2 id="tieu-de-dang-ky">
        Đăng ký tham gia
      </h2>

      <form id="bieu-mau-dang-ky">

        <label for="ho-ten">Họ và tên</label>
        <input id="ho-ten"
               name="ho-ten"
               type="text"
               minlength="3"
               maxlength="100"
               required>

        <label for="email">Email</label>
        <input id="email"
               name="email"
               type="email"
               required>

        <button id="nut-gui" type="submit">
          Đăng ký
        </button>

        <p id="thong-bao" role="status"></p>

      </form>
    </section>

  </main>

  <footer>
    <p>&copy; 2026 - Ngày hội công nghệ</p>
  </footer>

</body>
</html>
